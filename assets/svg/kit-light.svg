@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
@keyframes go0 { from { transform: translateX(-189.5px); } } .go0 { animation: go0 1.1s cubic-bezier(.2,.7,.2,1) 0.35s both; } @keyframes go1 { from { transform: translateX(-142.2px); } } .go1 { animation: go1 1.1s cubic-bezier(.2,.7,.2,1) 0.44s both; } @keyframes go2 { from { transform: translateX(-94.8px); } } .go2 { animation: go2 1.1s cubic-bezier(.2,.7,.2,1) 0.53s both; } @keyframes go3 { from { transform: translateX(-79.0px); } } .go3 { animation: go3 1.1s cubic-bezier(.2,.7,.2,1) 0.62s both; } @keyframes go4 { from { transform: translateX(-63.2px); } } .go4 { animation: go4 1.1s cubic-bezier(.2,.7,.2,1) 0.71s both; } @keyframes go5 { from { transform: translateX(-47.4px); } } .go5 { animation: go5 1.1s cubic-bezier(.2,.7,.2,1) 0.80s both; } @keyframes go6 { from { transform: translateX(-31.6px); } } .go6 { animation: go6 1.1s cubic-bezier(.2,.7,.2,1) 0.89s both; }</style>
