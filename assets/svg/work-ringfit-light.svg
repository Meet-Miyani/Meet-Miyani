<svg xmlns="http://www.w3.org/2000/svg" width="960" height="75" viewBox="0 0 960 75" fill="none" role="img" aria-label="RingFit — Ring sizing with a custom ruler and Canvas UX (500K+ installs)"><title>RingFit — Ring sizing with a custom ruler and Canvas UX (500K+ installs)</title><style>
text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
.in { animation: in .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.draw { transform-box: fill-box; transform-origin: left; animation: draw 1.1s cubic-bezier(.2,.7,.2,1) both; }
@keyframes draw { from { transform: scaleX(0); } }
.breathe { transform-box: fill-box; transform-origin: center; animation: breathe 3.2s ease-in-out infinite; opacity: 0; }
@keyframes breathe { 0%, 100% { opacity: 0; transform: scale(1); } 50% { opacity: .35; transform: scale(2.4); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="draw" style="animation-delay:0.16s" x="0" y="0" width="960" height="1" fill="#D1D9E0"/>
<g class="in" style="animation-delay:0.31s">
  <text class="mono" x="0" y="44" font-size="13" fill="#818B98">03</text>
  <text x="44" y="45" font-size="18" font-weight="600" fill="#1F2328">RingFit</text>
  <text x="224" y="45" font-size="16" fill="#59636E">Ring sizing with a custom ruler and Canvas UX</text>
  <text class="mono" x="930" y="44" text-anchor="end" font-size="13" fill="#59636E">500K+ installs</text>
  <text x="960" y="45" text-anchor="end" font-size="16" fill="#818B98">↗</text>
</g>
</svg>
