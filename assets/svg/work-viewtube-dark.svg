<svg xmlns="http://www.w3.org/2000/svg" width="960" height="76" viewBox="0 0 960 76" fill="none" role="img" aria-label="ViewTube — Video player: offline, subtitles, Shorts-style feed (100K+ installs)"><title>ViewTube — Video player: offline, subtitles, Shorts-style feed (100K+ installs)</title><style>
